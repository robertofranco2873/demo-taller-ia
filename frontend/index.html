<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AutoServicio Demo: gestión de taller con herramientas de Ingeniería Industrial. Demo con datos ficticios." />
    <meta name="theme-color" content="#5a4597" />
    <title>AutoServicio Demo</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita parpadeo).
      try {
        const t = localStorage.getItem("tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
